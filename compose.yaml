services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${CORE_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://commerce:commerce@postgres:5432/commerce
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: local-demo-secret-not-for-production
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: LocalAdmin123!
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: commerce
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d commerce"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  inventory-api:
    build:
      context: .
      dockerfile: Dockerfile.inventory
    ports:
      - "${INVENTORY_PORT:-8001}:8001"
    environment:
      DATABASE_URL: postgresql://commerce:commerce@postgres:5432/commerce
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: local-demo-secret-not-for-production
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  orders-api:
    build:
      context: .
      dockerfile: Dockerfile.orders
    ports:
      - "${ORDERS_PORT:-8002}:8002"
    environment:
      DATABASE_URL: postgresql://commerce:commerce@postgres:5432/commerce
      JWT_SECRET: local-demo-secret-not-for-production
    depends_on:
      api:
        condition: service_healthy
      inventory-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
      inventory-api:
        condition: service_healthy
      orders-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  qa:
    build:
      context: .
      dockerfile: Dockerfile.qa
    environment:
      BASE_URL: http://api:8000
      INVENTORY_URL: http://inventory-api:8001
      ORDERS_URL: http://orders-api:8002
      WEB_URL: http://web:8080
      DATABASE_URL: postgresql://commerce:commerce@postgres:5432/commerce
      JWT_SECRET: local-demo-secret-not-for-production
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: LocalAdmin123!
      REDIS_URL: redis://redis:6379/0
    depends_on:
      api:
        condition: service_healthy
      inventory-api:
        condition: service_healthy
      orders-api:
        condition: service_healthy
      web:
        condition: service_healthy
    init: true
    ipc: host
    volumes:
      - ./test-results:/workspace/test-results
      - ./allure-results:/workspace/allure-results
    profiles: ["qa"]

  allure-report:
    build:
      context: .
      dockerfile: Dockerfile.allure
    volumes:
      - ./allure-results:/allure-results:ro
      - ./allure-report:/allure-report
    profiles: ["report"]

  locust:
    build:
      context: .
      dockerfile: Dockerfile.load
    environment:
      CORE_URL: http://api:8000
      INVENTORY_URL: http://inventory-api:8001
      ORDERS_URL: http://orders-api:8002
      DATABASE_URL: postgresql://commerce:commerce@postgres:5432/commerce
      REDIS_URL: redis://redis:6379/0
      RESULTS_DIR: /results
      LOAD_RUN_ID: ${LOAD_RUN_ID:-local}
    depends_on:
      api:
        condition: service_healthy
      inventory-api:
        condition: service_healthy
      orders-api:
        condition: service_healthy
    volumes:
      - ./qa/load:/mnt/locust:ro
      - ./performance-results:/results
    profiles: ["performance"]
    command:
      - -f
      - /mnt/locust/locustfile.py

  load-cleanup:
    build:
      context: .
      dockerfile: Dockerfile.load
    entrypoint: ["python", "/mnt/locust/data.py"]
    command: ["cleanup"]
    environment:
      DATABASE_URL: postgresql://commerce:commerce@postgres:5432/commerce
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./qa/load:/mnt/locust:ro
    profiles: ["performance"]

  zap-web:
    image: zaproxy/zap-stable:2.17.0
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./qa/security:/zap/config:ro
      - ./security-results:/zap/wrk:rw
    profiles: ["security"]
    command:
      - zap-baseline.py
      - -t
      - http://web:8080
      - -m
      - "1"
      - -c
      - /zap/config/zap-web.conf
      - -r
      - web.html
      - -J
      - web.json
      - -w
      - web.md
      - -I

  zap-api:
    image: zaproxy/zap-stable:2.17.0
    depends_on:
      api:
        condition: service_healthy
      inventory-api:
        condition: service_healthy
      orders-api:
        condition: service_healthy
    volumes:
      - ./qa/security:/zap/config:ro
      - ./security-results:/zap/wrk:rw
    profiles: ["security"]
    command:
      - zap-api-scan.py
      - -t
      - http://api:8000/openapi.json
      - -f
      - openapi
      - -S
      - -c
      - /zap/config/zap-api.conf
      - -r
      - core-api.html
      - -J
      - core-api.json
      - -w
      - core-api.md
      - -I

  zap-check:
    image: python:3.12-slim
    working_dir: /workspace
    volumes:
      - ./qa/security:/workspace/qa/security:ro
      - ./security-results:/workspace/security-results:rw
    profiles: ["security"]
    entrypoint: ["python", "qa/security/check_reports.py"]

volumes:
  postgres_data:
